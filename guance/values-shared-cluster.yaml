default:
  image:
    repository: docker.m.daocloud.io/otel/demo

components:
  accounting:
    initContainers:
      - name: wait-for-kafka
        image: docker.m.daocloud.io/library/busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

  cart:
    initContainers:
      - name: wait-for-valkey-cart
        image: docker.m.daocloud.io/library/busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep 2; done;"]

  checkout:
    initContainers:
      - name: wait-for-kafka
        image: docker.m.daocloud.io/library/busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

  fraud-detection:
    initContainers:
      - name: wait-for-kafka
        image: docker.m.daocloud.io/library/busybox:latest
        command: ["sh", "-c", "until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;"]

  frontend:
    envOverrides:
      - name: HOSTNAME
        value: 0.0.0.0
      - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        value: /otlp-http/v1/traces

  frontend-proxy:
    service:
      type: NodePort
      port: 8080
      nodePort: 32081

  flagd:
    initContainers:
      - name: init-config
        image: docker.m.daocloud.io/library/busybox:latest
        command: ["sh", "-c", "cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json"]
        volumeMounts:
          - mountPath: /config-ro
            name: config-ro
          - mountPath: /config-rw
            name: config-rw

  postgresql:
    imageOverride:
      repository: docker.m.daocloud.io/library/postgres
      tag: "17.6"

  valkey-cart:
    imageOverride:
      repository: docker.m.daocloud.io/valkey/valkey
      tag: "9.0.1-alpine3.23"

opentelemetry-collector:
  mode: deployment
  presets:
    hostMetrics:
      enabled: false
    kubernetesAttributes:
      enabled: false
    kubeletMetrics:
      enabled: false
    clusterMetrics:
      enabled: false
    annotationDiscovery:
      metrics:
        enabled: false
  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
            cors:
              allowed_origins:
                - "http://*"
                - "https://*"
    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      batch: {}
      resource:
        attributes:
          - key: project
            value: otel-demo
            action: upsert
          - key: env
            value: guance-shared-k8s
            action: upsert
          - key: cluster_name_k8s
            value: otel-demo-ack-shared
            action: upsert
          - key: k8s.cluster.name
            value: otel-demo-ack-shared
            action: upsert
          - key: k8s.namespace.name
            value: otel-demo-yww-20260325
            action: upsert
    exporters:
      otlp/datakit:
        endpoint: otel-demo-datakit:4317
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/datakit]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/datakit]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp/datakit]
  image:
    repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
  service:
    type: ClusterIP

jaeger:
  enabled: false

prometheus:
  enabled: false

grafana:
  enabled: false

opensearch:
  enabled: false
